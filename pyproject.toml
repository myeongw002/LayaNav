[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layanav"
version = "0.1.0"
description = "Partially observable grid navigation research with online mapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
train = ["torch>=2.7,<3"]
ppo = ["stable-baselines3>=2.9.2,<3"]
laya = ["laya==0.4.31"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
# Install a CUDA-compatible PyTorch build separately before future Laya training.

[project.scripts]
layanav = "layanav.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
