name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Syntax and lint
        run: |
          python -m compileall -q src tests
          ruff check src tests
      - name: Unit tests
        run: pytest -q

  gui-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install GUI dependencies
        run: python -m pip install -e ".[gui,dev]"
      - name: Offscreen GUI test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_gui.py

  train-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and tests
        run: python -m pip install -e ".[train,ppo,dev]"
      - name: CPU behavior-cloning smoke
        run: pytest -q tests/test_training.py tests/test_ppo.py tests/test_laya_spatial.py tests/test_laya_bc.py
